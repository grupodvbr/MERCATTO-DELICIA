<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle de Perdas • Mercatto</title>

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ===== BASE ===== */
*{box-sizing:border-box}

body{
margin:0;
font-family:Inter;
background:#f8fafc;
color:#0f172a;
}

/* HEADER */
.header{
padding:16px;
font-size:18px;
font-weight:800;
background:#111827;
color:#fff;
}

/* CONTAINER */
.container{
padding:16px;
max-width:900px;
margin:auto;
}

/* CARD */
.card{
background:#fff;
border-radius:16px;
padding:16px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
margin-bottom:16px;
}

/* INPUT */
input, textarea{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #e5e7eb;
margin-top:8px;
font-family:Inter;
}

/* BOTAO */
button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#22c55e;
color:#fff;
font-weight:700;
cursor:pointer;
margin-top:10px;
}

/* GRID DIAS */
.dias{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
gap:12px;
}

.dia{
background:#fff;
padding:14px;
border-radius:14px;
text-align:center;
font-weight:600;
cursor:pointer;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

/* MODAL */
.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.modal-content{
background:#fff;
padding:16px;
border-radius:16px;
width:95%;
max-height:90%;
overflow:auto;
}

/* FOTO */
.foto{
width:100%;
border-radius:12px;
margin-bottom:8px;
}

.obs{
font-size:14px;
color:#374151;
margin-bottom:16px;
}

</style>
</head>
<body>

<div class="header">📸 Controle de Perdas</div>

<div class="container">

<!-- ENVIO -->
<div class="card">
<label>Data</label>
<input type="date" id="data">

<label>Observação</label>
<textarea id="obs"></textarea>

<label>Foto</label>
<input type="file" id="foto">

<button onclick="enviar()">Salvar</button>
</div>

<!-- BUSCA -->
<div class="card">
<input type="date" id="buscar" onchange="carregarDias()">
</div>

<!-- LISTA DIAS -->
<div id="dias" class="dias"></div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content" id="conteudo"></div>
</div>

<script>

const supabase = window.supabase.createClient(
  "https://ehxrrpsiksceljmhsfxk.supabase.co",
  "sb_publishable_Jm2ZQKzPS3gNPCKSjFAmYQ_WNMYwF1j"
)


  
/* ================= ENVIAR ================= */

async function enviar(){

const data = document.getElementById("data").value
const obs = document.getElementById("obs").value
const file = document.getElementById("foto").files[0]

if(!data || !file){
alert("Preencha data e foto")
return
}

const nome = Date.now()+"_"+file.name

/* upload */
const { error:uploadError } = await supabase.storage
.from("buffet_percas")
.upload(nome,file)

if(uploadError){
alert("Erro upload")
return
}

const { data:publicData } = supabase.storage
.from("buffet_percas")
.getPublicUrl(nome)

const url = publicData.publicUrl

/* salvar banco */
await supabase.from("percas").insert([{
data,
observacao:obs,
foto_url:url
}])

alert("Salvo com sucesso!")

carregarDias()
}

/* ================= CARREGAR DIAS ================= */

async function carregarDias(){

let query = supabase
.from("percas")
.select("data")

const filtro = document.getElementById("buscar").value

if(filtro){
query = query.eq("data",filtro)
}

const { data } = await query

const dias = [...new Set(data.map(d=>d.data))]

const div = document.getElementById("dias")
div.innerHTML=""

dias.forEach(d=>{

const el = document.createElement("div")
el.className="dia"
el.innerText = d.split("-").reverse().join("/")

el.onclick = ()=>abrirDia(d)

div.appendChild(el)

})

}

/* ================= ABRIR DIA ================= */

async function abrirDia(dia){

const { data } = await supabase
.from("percas")
.select("*")
.eq("data",dia)
.order("created_at",{ascending:false})

const modal = document.getElementById("modal")
const conteudo = document.getElementById("conteudo")

conteudo.innerHTML = `<h3>${dia}</h3>`

data.forEach(item=>{

conteudo.innerHTML += `
<img src="${item.foto_url}" class="foto">
<div class="obs">${item.observacao || ""}</div>
`
})

modal.style.display="flex"

}

/* FECHAR MODAL */
document.getElementById("modal").onclick = ()=>{
document.getElementById("modal").style.display="none"
}

/* INIT */
carregarDias()

</script>

</body>
</html>
