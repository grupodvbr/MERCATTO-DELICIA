<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<title>Controle de Perdas • Mercatto</title>

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ===== BASE ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
margin:0;
font-family:Inter;
background:#f1f5f9;
color:#0f172a;
}

/* HEADER */
.header{
padding:20px;
font-size:20px;
font-weight:800;
background:#020617;
color:#fff;
}

/* CONTAINER */
.container{
padding:16px;
max-width:900px;
margin:auto;
}

/* CARD */
.card{
background:#fff;
border-radius:20px;
padding:16px;
box-shadow:0 12px 30px rgba(0,0,0,.08);
margin-bottom:16px;
}

/* TEXTAREA */
textarea{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid #e2e8f0;
margin-top:8px;
}

/* FILE */
.file{
margin-top:10px;
}

/* BOTAO */
button{
width:100%;
padding:16px;
border:none;
border-radius:14px;
background:#22c55e;
color:#fff;
font-weight:700;
font-size:16px;
margin-top:12px;
}

/* GRID DIAS */
.dias{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
gap:12px;
}

/* DIA */
.dia{
background:#fff;
padding:16px;
border-radius:16px;
text-align:center;
font-weight:700;
box-shadow:0 6px 16px rgba(0,0,0,.08);
cursor:pointer;
}

/* ===== GALERIA ===== */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
gap:10px;
margin-top:12px;
}

.thumb{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
border-radius:12px;
cursor:pointer;
}

/* OBS */
.obs{
font-size:13px;
margin-top:4px;
color:#475569;
}

/* ===== MODAL GALERIA ===== */
.viewer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:none;
align-items:center;
justify-content:center;
z-index:9999;
}

.viewer img{
max-width:95%;
max-height:85%;
border-radius:12px;
}

.close{
position:absolute;
top:20px;
right:20px;
font-size:22px;
color:#fff;
background:rgba(0,0,0,.5);
padding:8px 12px;
border-radius:10px;
cursor:pointer;
}

/* ===== MODAL DIA ===== */
.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.modal-box{
background:#fff;
border-radius:20px;
padding:16px;
width:95%;
max-height:90%;
overflow:auto;
}

/* ===== OVERLAY ===== */
.loading{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
display:none;
align-items:center;
justify-content:center;
color:#fff;
font-weight:700;
z-index:9999;
}

/* TABLET */
@media(min-width:768px){
.container{max-width:700px;}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
}

</style>
</head>

<body>

<div class="header">📸 Controle de Perdas</div>

<div class="container">

<div class="card">
<div><b>Data:</b> <span id="dataHoje"></span></div>

<textarea id="obs" placeholder="Observação..."></textarea>

<input type="file" id="foto" class="file" accept="image/*" capture="environment">

<button onclick="enviar()">Salvar</button>
</div>

<div class="card">
<input type="date" id="buscar" onchange="carregarDias()" style="width:100%;padding:12px;border-radius:12px">
</div>

<div id="dias" class="dias"></div>

</div>

<!-- MODAL DIA -->
<div class="modal" id="modal">
<div class="modal-box" id="conteudo"></div>
</div>

<!-- VIEWER -->
<div class="viewer" id="viewer">
<div class="close" onclick="fecharViewer()">✕</div>
<img id="imgViewer">
</div>

<!-- LOADING -->
<div class="loading" id="loading">Enviando...</div>

<script>

const sb = window.supabase.createClient(
  "https://ehxrrpsiksceljmhsfxk.supabase.co",
  "sb_publishable_Jm2ZQKzPS3gNPCKSjFAmYQ_WNMYwF1j"
)

/* DATA */
function hoje(){
return new Date().toISOString().split("T")[0]
}

function formatar(d){
return d.split("-").reverse().join("/")
}

document.getElementById("dataHoje").innerText = formatar(hoje())

/* ENVIAR */
async function enviar(){

const loading = document.getElementById("loading")
loading.style.display="flex"

const file = document.getElementById("foto").files[0]
const obs = document.getElementById("obs").value

if(!file){
alert("Selecione uma foto")
loading.style.display="none"
return
}

const nome = `perca_${Date.now()}.jpg`

const { error } = await sb.storage
.from("buffet_percas")
.upload(nome,file,{upsert:true})

if(error){
alert("Erro upload")
loading.style.display="none"
return
}

const { data } = sb.storage
.from("buffet_percas")
.getPublicUrl(nome)

await sb.from("percas").insert([{
data: hoje(),
observacao: obs,
foto_url: data.publicUrl
}])

document.getElementById("obs").value=""
document.getElementById("foto").value=""

loading.style.display="none"

carregarDias()
}

/* DIAS */
async function carregarDias(){

const { data } = await sb.from("percas").select("data")

const dias = [...new Set(data.map(d=>d.data))]

const div = document.getElementById("dias")
div.innerHTML=""

dias.forEach(d=>{
const el = document.createElement("div")
el.className="dia"
el.innerText=formatar(d)
el.onclick=()=>abrirDia(d)
div.appendChild(el)
})

}

/* ABRIR DIA */
async function abrirDia(dia){

const { data } = await sb
.from("percas")
.select("*")
.eq("data",dia)

const conteudo = document.getElementById("conteudo")

conteudo.innerHTML = `<h3>${formatar(dia)}</h3><div class="grid">`

data.forEach(item=>{
conteudo.innerHTML += `
<div>
<img src="${item.foto_url}" class="thumb" onclick="ver('${item.foto_url}')">
<div class="obs">${item.observacao || ""}</div>
</div>
`
})

conteudo.innerHTML += `</div>`

document.getElementById("modal").style.display="flex"
}

/* VIEWER */
function ver(src){
document.getElementById("imgViewer").src = src
document.getElementById("viewer").style.display="flex"
}

function fecharViewer(){
document.getElementById("viewer").style.display="none"
}

/* FECHAR MODAL */
document.getElementById("modal").onclick = e=>{
if(e.target.id==="modal"){
e.target.style.display="none"
}
}

/* INIT */
carregarDias()

</script>

</body>
</html>
