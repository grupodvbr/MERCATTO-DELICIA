<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<title>Controle de Perdas • Mercatto</title>

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ===== BASE ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
margin:0;
font-family:Inter;
background:#f1f5f9;
color:#0f172a;
}

/* HEADER */
.header{
padding:18px;
font-size:20px;
font-weight:800;
background:#020617;
color:#fff;
}

/* CONTAINER */
.container{
padding:16px;
max-width:900px;
margin:auto;
}

/* CARD */
.card{
background:#fff;
border-radius:18px;
padding:16px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
margin-bottom:16px;
}

/* INPUT */
textarea{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid #e2e8f0;
margin-top:8px;
font-family:Inter;
}

/* FILE */
.file{
margin-top:10px;
}

/* BOTAO */
button{
width:100%;
padding:16px;
border:none;
border-radius:14px;
background:#22c55e;
color:#fff;
font-weight:700;
font-size:16px;
margin-top:12px;
}

/* GRID DIAS */
.dias{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
gap:12px;
}

/* CARD DIA */
.dia{
background:#fff;
padding:16px;
border-radius:16px;
text-align:center;
font-weight:700;
box-shadow:0 6px 16px rgba(0,0,0,.08);
cursor:pointer;
}

/* MODAL */
.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.modal-box{
background:#fff;
border-radius:20px;
padding:16px;
width:95%;
max-height:90%;
overflow:auto;
}

/* FOTO */
.foto{
width:100%;
border-radius:12px;
margin-bottom:8px;
}

/* OBS */
.obs{
font-size:14px;
color:#475569;
margin-bottom:20px;
}

/* TABLET */
@media(min-width:768px){
.container{
max-width:700px;
}
}

</style>
</head>
<body>

<div class="header">📸 Controle de Perdas</div>

<div class="container">

<!-- ENVIO -->
<div class="card">

<div style="font-weight:600">Data</div>
<div id="dataHoje" style="margin-top:6px;color:#64748b"></div>

<label style="margin-top:10px;display:block">Observação</label>
<textarea id="obs" placeholder="Descreva a perda..."></textarea>

<label style="margin-top:10px;display:block">Foto</label>
<input type="file" id="foto" class="file" accept="image/*" capture="environment">

<button onclick="enviar()">Salvar</button>

</div>

<!-- BUSCA -->
<div class="card">
<input type="date" id="buscar" onchange="carregarDias()" style="padding:12px;border-radius:12px;border:1px solid #e2e8f0;width:100%">
</div>

<!-- DIAS -->
<div id="dias" class="dias"></div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-box" id="conteudo"></div>
</div>

<script>

/* ================= SUPABASE ================= */

const sb = window.supabase.createClient(
  "https://ehxrrpsiksceljmhsfxk.supabase.co",
  "sb_publishable_Jm2ZQKzPS3gNPCKSjFAmYQ_WNMYwF1j"
)

/* ================= DATA HOJE ================= */

function hoje(){
const d = new Date()
return d.toISOString().split("T")[0]
}

function formatar(d){
return d.split("-").reverse().join("/")
}

document.getElementById("dataHoje").innerText = formatar(hoje())

/* ================= ENVIAR ================= */

async function enviar(){

const data = hoje()
const obs = document.getElementById("obs").value
const file = document.getElementById("foto").files[0]

if(!file){
alert("Selecione uma foto")
return
}

const nome = Date.now()+"_"+file.name

/* upload */
const { error } = await sb.storage
.from("buffet_percas")
.upload(nome,file)

if(error){
alert("Erro ao enviar imagem")
return
}

/* url */
const { data:publicData } = sb.storage
.from("buffet_percas")
.getPublicUrl(nome)

const url = publicData.publicUrl

/* salvar */
await sb.from("percas").insert([{
data,
observacao:obs,
foto_url:url
}])

alert("Salvo com sucesso!")

document.getElementById("obs").value=""
document.getElementById("foto").value=""

carregarDias()
}

/* ================= CARREGAR DIAS ================= */

async function carregarDias(){

let query = sb.from("percas").select("data")

const filtro = document.getElementById("buscar").value

if(filtro){
query = query.eq("data",filtro)
}

const { data } = await query

const dias = [...new Set(data.map(d=>d.data))]

const div = document.getElementById("dias")
div.innerHTML=""

dias.forEach(d=>{

const el = document.createElement("div")
el.className="dia"
el.innerText = formatar(d)

el.onclick = ()=>abrirDia(d)

div.appendChild(el)

})

}

/* ================= ABRIR DIA ================= */

async function abrirDia(dia){

const { data } = await sb
.from("percas")
.select("*")
.eq("data",dia)
.order("created_at",{ascending:false})

const modal = document.getElementById("modal")
const conteudo = document.getElementById("conteudo")

conteudo.innerHTML = `<h3>${formatar(dia)}</h3>`

data.forEach(item=>{
conteudo.innerHTML += `
<img src="${item.foto_url}" class="foto">
<div class="obs">${item.observacao || ""}</div>
`
})

modal.style.display="flex"
}

/* ================= FECHAR ================= */

document.getElementById("modal").onclick = ()=>{
document.getElementById("modal").style.display="none"
}

/* INIT */
carregarDias()

</script>

</body>
</html>
